name: quickb2b_v3_6
description: "A new Flutter project."
publish_to: 'none'


version: 1.0.0+1

environment:
  sdk: ^3.7.0


dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8
  get: ^4.7.2
  dio: ^5.8.0+1
  http: ^1.4.0
  shared_preferences: ^2.5.3
  flutter_screenutil: ^5.9.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:

  
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    -  assets/
    -  assets/images/

 
  fonts:
    - family: acumin 
      fonts:
        - asset: assets/fonts/acumin_regular.otf
          weight: 400 
        - asset: assets/fonts/acumin_semibold.ttf
          weight: 600
        - asset: assets/fonts/acuminbold.otf
          weight: 700 
    - family: open-sans 
      fonts:
        - asset: assets/fonts/open_sans_light.ttf
          weight: 300  
        - asset: assets/fonts/open_sans_regular.ttf
          weight: 400 
        - asset: assets/fonts/open_sans_semibold.ttf
          weight: 600
        - asset: assets/fonts/open_sans_bold.ttf
          weight: 700 
    - family: advantage-book 
      fonts:
        - asset: assets/fonts/advantage_book.ttf
          weight: 400
    - family: comic-sans 
      fonts:
        - asset: assets/fonts/comic_sans_ms.ttf
        
          